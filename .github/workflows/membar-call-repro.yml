# Throwaway workflow on a fork branch: build triton-opt and run the reduced case
# from triton-lang/triton#11326. Not for upstream.
name: membar-call-repro

on:
  push:
    branches: [ci/membar-call]
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache clang lld
          pip install -q -U pip cmake wheel pybind11

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: membar-ccache-${{ github.sha }}
          restore-keys: membar-ccache-

      - name: Build triton
        env:
          CCACHE_DIR: /home/runner/.ccache
          MAX_JOBS: "4"
        run: |
          pip install -q -r python/requirements.txt || true
          pip install -e . --no-build-isolation -v 2>&1 | tail -20

      - name: Locate triton-opt
        run: |
          find . -name triton-opt -type f | head -3
          echo "TRITON_OPT=$(find . -name triton-opt -type f | head -1)" >> $GITHUB_ENV

      - name: Provenance
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "triton-opt md5: $(md5sum $TRITON_OPT | cut -c1-12)"
          echo "--- the call arm in Membar.cpp ---"
          grep -n 'CallOpInterface\|entryBlockInfo\|getCallSummary' lib/Analysis/Membar.cpp || true

      - name: Reproducer
        run: |
          cat > /tmp/repro.mlir <<'EOM'
          #blockedCallSrc = #ttg.blocked<{sizePerThread = [1, 32], threadsPerWarp = [32, 1], warpsPerCTA = [4, 1], order = [0, 1]}>
          #mmaCall = #ttg.nvidia_mma<{versionMajor = 2, versionMinor = 0, warpsPerCTA = [4, 1], instrShape = [16, 8]}>
          #blockedCallDst = #ttg.dot_op<{opIdx = 0, parent = #mmaCall, kWidth = 2}>
          #smem = #ttg.shared_memory

          module attributes {"ttg.num-ctas" = 1 : i32, "ttg.num-warps" = 4 : i32} {
            tt.func private @callee_writes_first() -> tensor<128x32xf16, #blockedCallDst> {
              %cst = arith.constant dense<0.0> : tensor<128x32xf16, #blockedCallSrc>
              %cvt = ttg.convert_layout %cst : tensor<128x32xf16, #blockedCallSrc> -> tensor<128x32xf16, #blockedCallDst>
              tt.return %cvt : tensor<128x32xf16, #blockedCallDst>
            }

            tt.func @caller_pending_read_then_call() -> tensor<128x32xf16, #blockedCallDst> {
              %cst = arith.constant dense<0.0> : tensor<128x32xf16, #blockedCallSrc>
              %cvt = ttg.convert_layout %cst : tensor<128x32xf16, #blockedCallSrc> -> tensor<128x32xf16, #blockedCallDst>
              %call = tt.call @callee_writes_first() : () -> tensor<128x32xf16, #blockedCallDst>
              %sum = arith.addf %call, %cvt : tensor<128x32xf16, #blockedCallDst>
              tt.return %sum : tensor<128x32xf16, #blockedCallDst>
            }
          }
          EOM
          sed -i 's/^          //' /tmp/repro.mlir
          echo "=== output ==="
          $TRITON_OPT /tmp/repro.mlir --allocate-shared-memory -test-print-membar
          echo "=== barriere nel caller ==="
          $TRITON_OPT /tmp/repro.mlir --allocate-shared-memory -test-print-membar \
            | sed -n '/caller_pending_read_then_call/,/tt.return/p' \
            | grep -c 'ttg.barrier' || true
          echo "=== caller isolato ==="
          $TRITON_OPT /tmp/repro.mlir --allocate-shared-memory -test-print-membar \
            | sed -n '/caller_pending_read_then_call/,/^  }/p'

      - name: test-membar suite
        run: |
          FC=$(find . -name FileCheck -type f | head -1)
          echo "FileCheck: $FC"
          $TRITON_OPT test/Analysis/test-membar.mlir -split-input-file --allocate-shared-memory -test-print-membar \
            | $FC test/Analysis/test-membar.mlir
          echo "test-membar rc=$?"
